<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .event {
            background: #fff;
            color: #000;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .event button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .event button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Upcoming Events</h1>
    <div class="container">
        <div class="event-list" id="event-list"></div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadEvents() {
            const eventList = document.getElementById("event-list");
            const eventsRef = collection(db, "events");
            const snapshot = await getDocs(eventsRef);
            const today = new Date();
            
            snapshot.forEach(doc => {
                const event = doc.data();
                const eventDate = new Date(event.date);
                if (eventDate >= today) {
                    const eventElement = document.createElement("div");
                    eventElement.classList.add("event");
                    eventElement.innerHTML = `
                        <h2>${event.title}</h2>
                        <p><strong>Date:</strong> ${event.date}</p>
                        <p>${event.description}</p>
                        <button onclick="bookEvent('${doc.id}', '${event.title}')">Book Now</button>
                    `;
                    eventList.appendChild(eventElement);
                }
            });
        }

        async function bookEvent(eventId, eventTitle) {
            try {
                await addDoc(collection(db, "bookings"), {
                    eventId,
                    eventTitle,
                    user: "Guest User",
                    timestamp: new Date().toISOString()
                });
                alert("Successfully booked: " + eventTitle);
            } catch (error) {
                console.error("Error booking event: ", error);
            }
        }

        loadEvents();
    </script>
</body>
</html>
