<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="CSS and Script\Sign.css">
  <title>Sliding Signup and SignIn</title>
  <style>
    
  </style>
</head>
<body style=" height:auto ;width: auto  ;background-image: url('pics\\home.png')" >

<div class="container">
  <div class="header">Avant-Garde</div>
  <div class="form-container">
    <!-- Sign In -->
    <div class="signin">
      <h2>Sign In</h2>
      <form>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <!-- Sign Up -->
    <div class="signup">
      <h2>Sign Up</h2>
      <form>
        <input type="text" placeholder="firstName" required>
        <input type="text" placeholder="lastName" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="confirm Password" required>
        <button type="submit"  >Sign Up</button>
      </form>
    </div>
  </div>
  <button class="toggle-btn" onclick="toggleSlide()">Sign Up</button>
</div>

<script src="CSS and Script\SignS.js">
 </script>

</body>
</html>
