<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="CSS and Script\Sign.css">
  <title>Sliding Signup and SignIn</title>

</head>
<body>

<div class="container">
  <div class="inner-container" id="inner-container">
    <!-- Sign In -->
    <div class="form-container signin">
      <h2>Sign In</h2>
      <form>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <a href="#">Forgot Password?</a>
      </form>
      <button class="toggle-btn" onclick="flipCard()">Go to Sign Up</button>
    </div>

    <!-- Sign Up -->
    <div class="form-container signup">
      <h2>Sign Up</h2>
      <form>
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>
        <button type="submit">Sign Up</button>
        <a href="CMS.html">Go to Home Page</a>
      </form>
      <button class="toggle-btn" onclick="flipCard()">Go to Sign In</button>
    </div>
  </div>
</div>

<script>
  function flipCard() {
    document.getElementById('inner-container').classList.toggle('flipped');
  }
</script>

</body>
</html>
